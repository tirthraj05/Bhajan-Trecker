<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Bhajan Ledger</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf6ec;--card:#fff;--ink:#3b2a1a;--mute:#8a7560;--acc:#d9691e;--acc2:#fbe3cf;--line:#ecdcc8;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1510;--card:#261e17;--ink:#f3e8da;--mute:#b3a08a;--acc:#f08a3c;--acc2:#3a2a1c;--line:#3a2e22;--ok:#6fcf97}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1510;--card:#261e17;--ink:#f3e8da;--mute:#b3a08a;--acc:#f08a3c;--acc2:#3a2a1c;--line:#3a2e22;--ok:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.wrap{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}h1{grid-column:1/-1}}
h1{margin:4px 0;font-size:1.6rem;text-align:center;letter-spacing:.5px}
h2{margin:0 0 10px;font-size:1.1rem;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:8px 12px}
.btn.ghost{background:var(--acc2);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .n{flex:1}.row .num{font-size:1.4rem;font-weight:700;color:var(--ok);min-width:2ch;text-align:right}
.row input{width:80px;padding:8px}
.hist{max-height:260px;overflow-y:auto}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.h button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1rem}
.mute{color:var(--mute);font-size:.85rem}
.msg{text-align:center;color:var(--mute);padding:20px}
.mon{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.mon b{font-size:1rem}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;scroll-snap-type:x proximity}
.day{flex:0 0 auto;width:54px;padding:8px 0 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center;cursor:pointer;scroll-snap-align:center;position:relative}
.day small{display:block;font-size:.7rem;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.day span{display:block;font-size:1.25rem;font-weight:700}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day.on small{color:#ffe9d6}
.day.today{box-shadow:0 0 0 2px var(--acc2)}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0;background:transparent}
.day i.has{background:var(--ok)}
.day.on i.has{background:#fff}
.back{border:0;background:none;color:var(--acc);font:inherit;font-size:.85rem;cursor:pointer;padding:0}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}.tw{overflow:auto;max-height:320px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>My Bhajan Ledger</h1>

<section class="card">
  <h2>Add Entry</h2>
  <div id="fields"></div>
  <label for="dt">Date</label>
  <input id="dt" type="date">
  <button class="btn" id="save">Save Entry</button>
  <p class="mute" id="status"></p>
</section>

<aside>
  <section class="card">
    <h2>My Balance</h2>
    <div id="bal"><div class="msg">Loading…</div></div>
    <p class="mute">Enter a number and press Offer to give it to God. It is deducted from the balance.</p>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>Monthly Summary</h2>
    <div class="mon"><button class="btn sm ghost" onclick="shiftMonth(-1)">&lsaquo;</button><b id="monname"></b><button class="btn sm ghost" onclick="shiftMonth(1)">&rsaquo;</button></div>
    <div id="monsum"></div>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>History</h2>
    <div class="hist" id="hist"></div>
  </section>
</aside>
<section class="card" style="grid-column:1/-1">
  <h2>Data Table</h2>
  <div class="bar"><button class="btn sm" id="dl">Download CSV</button><button class="btn sm ghost" id="ld">Load from CSV file</button><input id="fi" type="file" accept=".csv,text/csv" style="display:none"></div>
  <p class="mute" id="note"></p>
  <div class="tw"><table><thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Count</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
<section class="card" style="grid-column:1/-1">
  <h2>Settings (token, once on each device)</h2>
  <label for="gt">GitHub token</label><input id="gt" type="password" autocomplete="off">
  <button class="btn" id="gs">Save settings</button>
</section>
</div>

<script>
const DEFAULT_KINDS=["Dandvat","Parikrama","Smaran Dhun","Kirtan"];
const LEGACY={"દંડવત":"Dandvat","પરિક્રમા":"Parikrama","સ્મરણ ધૂન":"Smaran Dhun","કીર્તન":"Kirtan"};
let db=null,rows=[],sel="";
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
sel=today();

function kinds(){const s=new Set(DEFAULT_KINDS);rows.forEach(r=>s.add(r.kind));return [...s]}

function renderStrip(scroll){$("dt").value=sel;return;
  const has=new Set(rows.filter(r=>r.type==="entry").map(r=>r.date));
  const S=$("strip");S.innerHTML="";
  const t=new Date();
  for(let n=29;n>=0;n--){
    const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-n),k=iso(d);
    const b=document.createElement("button");
    b.className="day"+(k===sel?" on":"")+(k===today()?" today":"");
    b.innerHTML="<small></small><span></span><i></i>";
    b.children[0].textContent=d.toLocaleDateString("en-US",{weekday:"short"});
    b.children[1].textContent=d.getDate();
    if(has.has(k))b.children[2].className="has";
    b.onclick=()=>{sel=k;renderStrip(false)};
    S.appendChild(b);
  }
  const [y,m,dd]=sel.split("-").map(Number);
  $("monlbl").textContent=new Date(y,m-1,dd).toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(scroll){const on=S.querySelector(".on");if(on)S.scrollLeft=on.offsetLeft-S.clientWidth+on.clientWidth+16}
}

function render(){
  const ks=kinds();
  const keep={};document.querySelectorAll("#fields input").forEach(i=>keep[i.dataset.k]=i.value);
  const F=$("fields");F.innerHTML="";
  ks.forEach(k=>{
    const l=document.createElement("label");l.textContent=k==="Smaran Dhun"?"Smaran Dhun (minutes)":k;
    const i=document.createElement("input");i.type="number";i.min="0";i.inputMode="numeric";i.placeholder=k==="Smaran Dhun"?"Minutes":"Count";i.dataset.k=k;i.value=keep[k]||"";
    F.append(l,i);
  });

  const bal={};ks.forEach(k=>bal[k]=0);
  rows.forEach(r=>{bal[r.kind]=(bal[r.kind]||0)+(r.type==="arpan"?-r.count:r.count)});
  const B=$("bal");B.innerHTML="";
  Object.keys(bal).forEach(k=>{
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<span class="n"></span><span class="num"></span>';
    d.children[0].textContent=k;d.children[1].textContent=bal[k]+unit(k);
    const i=document.createElement("input");i.type="number";i.min="1";i.inputMode="numeric";i.placeholder=k==="Smaran Dhun"?"Minutes":"Count";
    const b=document.createElement("button");b.className="btn sm ghost";b.textContent="Offer";
    b.onclick=()=>arpan(k,parseInt(i.value,10),bal[k],i);
    d.append(i,b);B.appendChild(d);
  });

  const H=$("hist");H.innerHTML="";
  [...rows].sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).forEach(r=>{
    const d=document.createElement("div");d.className="h";
    const t=document.createElement("span");
    t.textContent=r.date+" · "+(r.type==="arpan"?"Offered ":"Added ")+r.kind+" "+(r.type==="arpan"?"−":"+")+r.count+unit(r.kind);
    const x=document.createElement("button");x.textContent="✕";x.title="Delete";
    x.onclick=async()=>{if(confirm("Delete this entry?")){try{await db.doc("log/"+r.id).delete()}catch(e){alert("Could not delete")}}};
    d.append(t,x);H.appendChild(d);
  });
  if(!rows.length)H.innerHTML='<div class="msg">No entries yet</div>';
  renderStrip(false);renderMonth();renderTable();
}

const unit=k=>k==="Smaran Dhun"?" min":"";
const say=t=>{$("note").textContent=t};
// GitHub file where all data is kept. Change these 3 lines only if your names change.
const GH={owner:"tirthraj05",repo:"Bhajan-Trecker",path:"bhajan-data-2026-10-29.csv"};
function getCfg(){let t="";try{t=(JSON.parse(localStorage.getItem("bhajan_gh"))||{}).token||""}catch(e){}return {...GH,token:t}}
function ghDb(cfg){
  const API="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+cfg.path;
  const H={"Accept":"application/vnd.github+json"};if(cfg.token)H.Authorization="Bearer "+cfg.token;
  const noTok=()=>{say("Read only. Add your token in Settings (bottom) to save.");alert("Add your GitHub token in Settings at the bottom to save data.")};
  let map={},pending=[],timer=null,busy=false,retried=false;const subs=[];
  try{map=JSON.parse(localStorage.getItem("bhajan_cache"))||{}}catch(e){}
  const emit=()=>{try{localStorage.setItem("bhajan_cache",JSON.stringify(map))}catch(e){}const s={docs:Object.keys(map).map(id=>({id,data:()=>map[id]}))};subs.forEach(f=>f(s))};
  const b64=s=>btoa(unescape(encodeURIComponent(s)));
  const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
  const parse=t=>{const o={};t.split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{const [id,date,type,kind,count,createdAt]=l.split(",");const c=parseInt(count,10);if(id&&date&&kind&&c&&(type==="entry"||type==="arpan"))o[id]={type,kind,count:c,date,createdAt:createdAt||""}});return o};
  const csv=o=>["id,date,type,kind,count,createdAt",...Object.keys(o).map(id=>{const r=o[id];return [id,r.date,r.type,r.kind,r.count,r.createdAt||""].join(",")})].join("\n")+"\n";
  async function pull(){
    const r=await fetch(API+"?t="+Date.now(),{headers:H,cache:"no-store"});
    if(r.status===404)return {o:{},sha:null};
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();return {o:parse(unb64(j.content)),sha:j.sha};
  }
  async function flush(){
    if(busy||!pending.length)return;busy=true;say("Saving to GitHub…");
    const ops=pending;pending=[];
    try{
      for(let t=0;t<3;t++){
        const {o,sha}=await pull();
        ops.forEach(op=>{if(op.del)delete o[op.id];else o[op.id]=op.d});
        const body={message:"Update data",content:b64(csv(o))};if(sha)body.sha=sha;
        const r=await fetch(API,{method:"PUT",headers:H,body:JSON.stringify(body)});
        if(r.ok){map=o;emit();say("Saved to GitHub");busy=false;retried=false;if(pending.length)sched();return}
        if(r.status!==409&&r.status!==422)throw new Error(r.status);
      }
      throw new Error("conflict");
    }catch(e){
      pending=ops.concat(pending);busy=false;
      say("Save failed ("+e.message+"). Check Settings. Will retry.");
      if(!retried){retried=true;setTimeout(flush,5000)}
    }
  }
  const sched=()=>{clearTimeout(timer);timer=setTimeout(flush,700)};
  return {
    doc:p=>{const id=p.split("/")[1];return {
      set:async d=>{if(!cfg.token)return noTok();map[id]=d;pending.push({id,d});emit();sched()},
      delete:async()=>{if(!cfg.token)return noTok();delete map[id];pending.push({id,del:1});emit();sched()}}},
    collection:()=>({onSnapshot:f=>{subs.push(f);emit();return ()=>{}}}),
    load:async()=>{const {o}=await pull();if(!pending.length&&!busy){map=o;emit()}}
  };
}
function renderTable(){
  const T=$("tb");T.innerHTML="";
  [...rows].sort((a,b)=>(b.date+(b.createdAt||"")).localeCompare(a.date+(a.createdAt||""))).forEach(r=>{
    const tr=document.createElement("tr");
    [r.date,r.kind,r.type==="arpan"?"Offered":"Added",r.count+unit(r.kind)].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
    T.appendChild(tr);
  });
}
function toCsv(){return ["id,date,type,kind,count,createdAt",...rows.map(r=>[r.id,r.date,r.type,r.kind,r.count,r.createdAt||""].join(","))].join("\n")}
async function dlCsv(){
  const blob=new Blob([toCsv()],{type:"text/csv"}),name="bhajan-data-"+today()+".csv";
  let d=null;try{d=await claude.use("downloads")}catch(e){}
  if(d){try{await d.save({filename:name,data:blob})}catch(e){}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function loadCsv(file){
  const lines=(await file.text()).split(/\r?\n/).slice(1).filter(Boolean);let n=0;
  for(const ln of lines){
    const [id,date,type,kind,count,createdAt]=ln.split(",");const c=parseInt(count,10);
    if(!id||!date||!kind||!c||!["entry","arpan"].includes(type))continue;
    await db.doc("log/"+id).set({type,kind,count:c,date,createdAt:createdAt||""});n++;
  }
  $("note").textContent=n+" rows loaded.";
}
$("dl").onclick=dlCsv;
$("ld").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(f&&db)loadCsv(f);e.target.value=""};
let mon=today().slice(0,7);
function renderMonth(){
  const [y,m]=mon.split("-").map(Number);
  $("monname").textContent=new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const M=$("monsum");M.innerHTML="";
  const tot={};kinds().forEach(k=>tot[k]={a:0,o:0});
  rows.filter(r=>r.date&&r.date.slice(0,7)===mon).forEach(r=>{const t=tot[r.kind]||(tot[r.kind]={a:0,o:0});if(r.type==="arpan")t.o+=r.count;else t.a+=r.count});
  Object.keys(tot).forEach(k=>{const d=document.createElement("div");d.className="row";d.innerHTML='<span class="n"></span><span></span>';d.children[0].textContent=k;d.children[1].textContent="Added "+tot[k].a+unit(k)+" · Offered "+tot[k].o+unit(k);M.appendChild(d)});
}
function shiftMonth(n){const [y,m]=mon.split("-").map(Number);const d=new Date(y,m-1+n,1);mon=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");renderMonth()}

async function add(type,k,count,date){
  const id="e"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
  await db.doc("log/"+id).set({type,kind:k,count,date,createdAt:new Date().toISOString()});
}

$("dt").onchange=()=>{sel=$("dt").value||today()};

$("save").onclick=async()=>{
  if(!db)return alert("Database is not available");
  const inputs=[...document.querySelectorAll("#fields input")];
  const items=inputs.map(i=>({k:i.dataset.k,c:parseInt(i.value,10)})).filter(x=>x.c>0);
  if(!items.length)return alert("Enter a count for at least one item");
  const date=sel;
  inputs.forEach(i=>i.value="");
  try{
    await Promise.all(items.map(x=>add("entry",x.k,x.c,date)));
    sel=today();renderStrip(true);
    $("status").textContent="Saved: "+items.map(x=>x.k+" "+x.c+unit(x.k)).join(", ");
  }catch(e){
    items.forEach(x=>{const i=inputs.find(n=>n.dataset.k===x.k);if(i)i.value=x.c});
    alert("Save failed, please try again");
  }
};

async function arpan(k,c,have,inp){
  if(!c||c<1)return alert("Enter a count to offer");
  if(c>have&&!confirm("This is more than your balance. Continue?"))return;
  try{await add("arpan",k,c,today());inp.value=""}catch(e){alert("Save failed")}
}

render();renderStrip(true);
(async()=>{
  const cfg=getCfg();
  $("gt").value=cfg.token;
  $("gs").onclick=()=>{try{localStorage.setItem("bhajan_gh",JSON.stringify({token:$("gt").value.trim()}))}catch(e){}location.reload()};
  db=ghDb(cfg);
  db.collection("log").onSnapshot(s=>{
    rows=s.docs.map(d=>{const v=d.data();return {id:d.id,...v,kind:LEGACY[v.kind]||v.kind}});
    render();
  });
  try{await db.load();say("Loaded from GitHub")}catch(e){say("Could not load from GitHub ("+e.message+"). Check Settings.")}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)db.load().catch(()=>{})});
  setInterval(()=>{if(!document.hidden)db.load().catch(()=>{})},30000);
})();
</script>
</body>
</html>
