<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Bhajan Ledger</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf6ec;--card:#fff;--ink:#3b2a1a;--mute:#8a7560;--acc:#d9691e;--acc2:#fbe3cf;--line:#ecdcc8;--ok:#2e7d4f;--err:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1510;--card:#261e17;--ink:#f3e8da;--mute:#b3a08a;--acc:#f08a3c;--acc2:#3a2a1c;--line:#3a2e22;--ok:#6fcf97;--err:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1510;--card:#261e17;--ink:#f3e8da;--mute:#b3a08a;--acc:#f08a3c;--acc2:#3a2a1c;--line:#3a2e22;--ok:#6fcf97;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.wrap{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}h1,.conn{grid-column:1/-1}}
h1{margin:4px 0;font-size:1.6rem;text-align:center;letter-spacing:.5px}
h2{margin:0 0 10px;font-size:1.1rem;color:var(--acc)}
.conn{text-align:center;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--acc2);color:var(--ink)}
.conn.ok{color:var(--ok)}.conn.err{color:var(--err)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:8px 12px}
.btn.ghost{background:var(--acc2);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .n{flex:1}.row .num{font-size:1.4rem;font-weight:700;color:var(--ok);min-width:2ch;text-align:right}
.row input{width:80px;padding:8px}
.hist{max-height:260px;overflow-y:auto}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.h button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1rem}
.mute{color:var(--mute);font-size:.85rem}
.msg{text-align:center;color:var(--mute);padding:20px}
.mon{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mon b{font-size:1rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.tw{overflow:auto;max-height:320px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>My Bhajan Ledger</h1>
<div class="conn" id="conn">Connecting…</div>

<section class="card">
  <h2>Add Entry</h2>
  <div id="fields"></div>
  <label for="dt">Date</label>
  <input id="dt" type="date">
  <button class="btn" id="save">Save Entry</button>
  <p class="mute" id="status"></p>
</section>

<aside>
  <section class="card">
    <h2>My Balance</h2>
    <div id="bal"><div class="msg">Loading…</div></div>
    <p class="mute">Enter a number and press Offer to give it to God. It is deducted from the balance.</p>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>Monthly Summary</h2>
    <div class="mon"><button class="btn sm ghost" onclick="shiftMonth(-1)">&lsaquo;</button><b id="monname"></b><button class="btn sm ghost" onclick="shiftMonth(1)">&rsaquo;</button></div>
    <div id="monsum"></div>
  </section>
  <section class="card" style="margin-top:16px">
    <h2>History</h2>
    <div class="hist" id="hist"></div>
  </section>
</aside>

<section class="card" style="grid-column:1/-1">
  <h2>Data Table</h2>
  <div class="bar">
    <button class="btn sm" id="sync">Sync now</button>
    <button class="btn sm ghost" id="dl">Download CSV</button>
    <button class="btn sm ghost" id="ld">Load from CSV file</button>
    <input id="fi" type="file" accept=".csv,text/csv" style="display:none">
  </div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Count</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
</div>

<script>
// Your Google Apps Script web app link (all data is stored in the linked Google Sheet)
const SHEET_URL="https://script.google.com/macros/s/AKfycbxGHyTeWsDm6IsjvlLl-dOLtMyIFVCDgIXQmKT88SUMoAY41r66yjQU0QlAvAxt0LQUYg/exec";

const DEFAULT_KINDS=["Dandvat","Parikrama","Smaran Dhun","Kirtan"];
const LEGACY={"દંડવત":"Dandvat","પરિક્રમા":"Parikrama","સ્મરણ ધૂન":"Smaran Dhun","કીર્તન":"Kirtan"};
let db=null,rows=[];
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const unit=k=>k==="Smaran Dhun"?" min":"";
const say=(t,c)=>{const e=$("conn");e.textContent=t;e.className="conn "+(c||"")};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let sel=today(),mon=today().slice(0,7);

function kinds(){const s=new Set(DEFAULT_KINDS);rows.forEach(r=>s.add(r.kind));return [...s]}

/* ---------- storage: Google Sheet through Apps Script ---------- */
function sheetDb(url){
  let map={},pending=[],timer=null,busy=false,fails=0;const subs=[];
  try{map=JSON.parse(localStorage.getItem("bhajan_cache"))||{}}catch(e){}
  try{pending=JSON.parse(localStorage.getItem("bhajan_pending"))||[]}catch(e){}
  const savePend=()=>{try{localStorage.setItem("bhajan_pending",JSON.stringify(pending))}catch(e){}};
  const emit=()=>{
    try{localStorage.setItem("bhajan_cache",JSON.stringify(map))}catch(e){}
    const s={docs:Object.keys(map).map(id=>({id,data:()=>map[id]}))};subs.forEach(f=>f(s));
  };
  const apply=(o,ops)=>{ops.forEach(op=>{if(op.del)delete o[op.id];else o[op.id]=op.d});return o};
  async function pull(){
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now());
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();const o={};
    (j.rows||[]).forEach(x=>{o[x.id]={type:x.type,kind:x.kind,count:x.count,date:x.date,createdAt:x.createdAt}});
    return o;
  }
  async function flush(){
    if(busy||!pending.length)return;
    busy=true;say("Saving…");
    const ops=pending.slice();
    try{
      await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({ops})});
      const last={};ops.forEach(op=>last[op.id]=op);
      let o=null,ok=false;
      for(let t=0;t<5&&!ok;t++){
        await sleep(1500);
        o=await pull();
        ok=Object.values(last).every(op=>op.del?!o[op.id]:!!o[op.id]);
      }
      if(!ok)throw new Error("the Sheet did not receive the data");
      pending=pending.slice(ops.length);savePend();
      map=apply(o,pending);emit();fails=0;busy=false;
      say("Saved to Google Sheet ✓","ok");
      if(pending.length)sched();
    }catch(e){
      busy=false;fails++;
      say("Not saved yet: "+e.message+". Retrying…","err");
      if(fails<=5)setTimeout(flush,4000*fails);
    }
  }
  const sched=()=>{clearTimeout(timer);timer=setTimeout(flush,700)};
  return {
    doc:p=>{const id=p.split("/")[1];return {
      set:async d=>{map[id]=d;pending.push({id,d});savePend();emit();sched()},
      delete:async()=>{delete map[id];pending.push({id,del:1});savePend();emit();sched()}}},
    collection:()=>({onSnapshot:f=>{subs.push(f);emit();return ()=>{}}}),
    load:async()=>{const o=await pull();if(!busy){map=apply(o,pending);emit()}},
    flush:()=>{fails=0;return flush()},
    start:()=>{if(pending.length)sched()},
    pendingCount:()=>pending.length
  };
}

/* ---------- screen ---------- */
function render(){
  const ks=kinds();
  const keep={};document.querySelectorAll("#fields input").forEach(i=>keep[i.dataset.k]=i.value);
  const F=$("fields");F.innerHTML="";
  ks.forEach(k=>{
    const l=document.createElement("label");l.textContent=k==="Smaran Dhun"?"Smaran Dhun (minutes)":k;
    const i=document.createElement("input");i.type="number";i.min="0";i.inputMode="numeric";
    i.placeholder=k==="Smaran Dhun"?"Minutes":"Count";i.dataset.k=k;i.value=keep[k]||"";
    F.append(l,i);
  });
  $("dt").value=sel;

  const bal={};ks.forEach(k=>bal[k]=0);
  rows.forEach(r=>{bal[r.kind]=(bal[r.kind]||0)+(r.type==="arpan"?-r.count:r.count)});
  const B=$("bal");B.innerHTML="";
  Object.keys(bal).forEach(k=>{
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<span class="n"></span><span class="num"></span>';
    d.children[0].textContent=k;d.children[1].textContent=bal[k]+unit(k);
    const i=document.createElement("input");i.type="number";i.min="1";i.inputMode="numeric";
    i.placeholder=k==="Smaran Dhun"?"Minutes":"Count";
    const b=document.createElement("button");b.className="btn sm ghost";b.textContent="Offer";
    b.onclick=()=>arpan(k,parseInt(i.value,10),bal[k],i);
    d.append(i,b);B.appendChild(d);
  });

  const sorted=[...rows].sort((a,b)=>(b.date+(b.createdAt||"")).localeCompare(a.date+(a.createdAt||"")));
  const H=$("hist");H.innerHTML="";
  sorted.forEach(r=>{
    const d=document.createElement("div");d.className="h";
    const t=document.createElement("span");
    t.textContent=r.date+" · "+(r.type==="arpan"?"Offered ":"Added ")+r.kind+" "+(r.type==="arpan"?"−":"+")+r.count+unit(r.kind);
    const x=document.createElement("button");x.textContent="✕";x.title="Delete";
    x.onclick=async()=>{if(confirm("Delete this entry?")){try{await db.doc("log/"+r.id).delete()}catch(e){alert("Could not delete")}}};
    d.append(t,x);H.appendChild(d);
  });
  if(!rows.length)H.innerHTML='<div class="msg">No entries yet</div>';

  const T=$("tb");T.innerHTML="";
  sorted.forEach(r=>{
    const tr=document.createElement("tr");
    [r.date,r.kind,r.type==="arpan"?"Offered":"Added",r.count+unit(r.kind)].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
    T.appendChild(tr);
  });
  renderMonth();
}

function renderMonth(){
  const [y,m]=mon.split("-").map(Number);
  $("monname").textContent=new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const M=$("monsum");M.innerHTML="";
  const tot={};kinds().forEach(k=>tot[k]={a:0,o:0});
  rows.filter(r=>r.date&&r.date.slice(0,7)===mon).forEach(r=>{const t=tot[r.kind]||(tot[r.kind]={a:0,o:0});if(r.type==="arpan")t.o+=r.count;else t.a+=r.count});
  Object.keys(tot).forEach(k=>{
    const d=document.createElement("div");d.className="row";d.innerHTML='<span class="n"></span><span></span>';
    d.children[0].textContent=k;d.children[1].textContent="Added "+tot[k].a+unit(k)+" · Offered "+tot[k].o+unit(k);M.appendChild(d);
  });
}
function shiftMonth(n){const [y,m]=mon.split("-").map(Number);const d=new Date(y,m-1+n,1);mon=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");renderMonth()}

/* ---------- actions ---------- */
async function add(type,k,count,date){
  const id="e"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
  await db.doc("log/"+id).set({type,kind:k,count,date,createdAt:new Date().toISOString()});
}
$("dt").onchange=()=>{sel=$("dt").value||today()};

$("save").onclick=async()=>{
  if(!db)return alert("Not connected yet");
  const inputs=[...document.querySelectorAll("#fields input")];
  const items=inputs.map(i=>({k:i.dataset.k,c:parseInt(i.value,10)})).filter(x=>x.c>0);
  if(!items.length)return alert("Enter a count for at least one item");
  const date=sel;
  inputs.forEach(i=>i.value="");
  for(const x of items)await add("entry",x.k,x.c,date);
  sel=today();$("dt").value=sel;
  $("status").textContent="Entered: "+items.map(x=>x.k+" "+x.c+unit(x.k)).join(", ");
};

async function arpan(k,c,have,inp){
  if(!db)return alert("Not connected yet");
  if(!c||c<1)return alert("Enter a count to offer");
  if(c>have&&!confirm("This is more than your balance. Continue?"))return;
  await add("arpan",k,c,today());inp.value="";
}

function toCsv(){return ["id,date,type,kind,count,createdAt",...rows.map(r=>[r.id,r.date,r.type,r.kind,r.count,r.createdAt||""].join(","))].join("\n")}
$("dl").onclick=()=>{
  const blob=new Blob([toCsv()],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bhajan-data-"+today()+".csv";
  document.body.appendChild(a);a.click();a.remove();
};
$("ld").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f||!db)return;
  const lines=(await f.text()).split(/\r?\n/).slice(1).filter(Boolean);let n=0;
  for(const ln of lines){
    const [id,date,type,kind,count,createdAt]=ln.split(",");const c=parseInt(count,10);
    if(!id||!date||!kind||!c||!["entry","arpan"].includes(type))continue;
    await db.doc("log/"+id).set({type,kind,count:c,date,createdAt:createdAt||""});n++;
  }
  say(n+" rows loaded from CSV. Saving…");
};
$("sync").onclick=async()=>{
  if(!db)return;
  try{await db.flush();await db.load();if(!db.pendingCount())say("Synced with Google Sheet ✓","ok")}
  catch(e){say("Cannot connect: "+e.message,"err")}
};
window.addEventListener("beforeunload",e=>{if(db&&db.pendingCount()){e.preventDefault();e.returnValue=""}});

/* ---------- start ---------- */
render();
(async()=>{
  db=sheetDb(SHEET_URL);
  db.collection("log").onSnapshot(s=>{
    rows=s.docs.map(d=>{const v=d.data();return {id:d.id,...v,kind:LEGACY[v.kind]||v.kind}});
    render();
  });
  try{await db.load();say("Connected to Google Sheet ✓","ok")}
  catch(e){say("Cannot connect to Google Sheet ("+e.message+"). Check that the link is right and access is set to Anyone.","err")}
  db.start();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)db.load().catch(()=>{})});
  setInterval(()=>{if(!document.hidden)db.load().catch(()=>{})},30000);
})();
</script>
</body>
</html>
